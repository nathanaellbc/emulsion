<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="EMULSION — a digital film laboratory in the browser. Scene-referred capture through a physically modelled negative, development, optical print and grain chain."

    <title>EMULSION — Digital Film Laboratory</title>
    <!-- Home-screen web app: iOS reads the apple-* tags, Android/Chromium the
        manifest. standalone keeps the browser chrome out; the status-bar and
        tile colour are the ground so the phone's own chrome disappears into
        the darkroom. -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EMULSION" />
    <meta name="theme_color" content="#060608" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>EMULSION renders film chemistry on your GPU and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
