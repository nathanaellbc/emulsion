<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="EMULSION — a digital film laboratory in the browser. Scene-referred capture through a physically modelled negative, development, optical print and grain chain."
    />
    <title>EMULSION — Digital Film Laboratory</title>
    <!-- Home-screen web app: iOS reads the apple-* tags, Android/Chromium the
        manifest. standalone keeps the browser chrome out; the status-bar and
        tile colour are the ground so the phone's own chrome disappears into
        the darkroom. -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": iOS 26 draws a Liquid Glass
        scroll-edge blur over any page that extends under a translucent status
        bar, and it reaches ~40 pt into the page, smearing the toolbar. With an
        opaque black bar the page starts below it, there is no edge to blur,
        and the bar is all but the ground's own colour. iOS reads this tag only
        when the app is added to the Home Screen: remove and re-add to see it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="EMULSION" />
    <meta name="theme-color" content="#060608" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>EMULSION renders film chemistry on your GPU and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
